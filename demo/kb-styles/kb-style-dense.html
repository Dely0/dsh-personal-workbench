<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2 · 密集列表 + 时间分组</title>
<style>
  /* 款式 2：密集列表 —— 单列行 + 左侧色条 + 时间分组头 + 编号分页 */
  .kbd-list { background: var(--bg); flex: 1 1 auto; }
  .kbar { display: flex; gap: 8px; align-items: center; padding: 12px 13px 10px; flex: none; }
  .tabs { display: flex; gap: 2px; padding: 0 13px; border-bottom: 1px solid var(--line-soft); flex: none; overflow-x: auto; }
  .tab { border: none; background: transparent; color: var(--fg-3); cursor: pointer; font: inherit; font-size: 12.5px;
    padding: 8px 11px 9px; border-bottom: 2px solid transparent; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .tab:hover { color: var(--fg); }
  .tab.on { color: var(--fg); font-weight: 600; border-bottom-color: var(--accent); }
  .tab i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .tab .cnt { font-size: 10.5px; color: var(--fg-3); background: rgba(255,255,255,.07); border-radius: 999px; padding: 1px 6px; }
  .tab.on .cnt { color: var(--fg); background: color-mix(in srgb, var(--accent) 24%, transparent); }
  .tags { display: flex; gap: 5px; flex-wrap: wrap; padding: 9px 13px 0; flex: none; }
  .tchip { border: 1px solid var(--line); background: transparent; color: var(--fg-3); border-radius: 999px;
    padding: 2px 9px; font: inherit; font-size: 11px; cursor: pointer; }
  .tchip.on { color: #cfe0ff; border-color: color-mix(in srgb, var(--accent) 55%, transparent);
    background: color-mix(in srgb, var(--accent) 15%, transparent); font-weight: 600; }

  .rows { padding: 6px 0 10px; }
  .ghead { display: flex; align-items: center; gap: 8px; padding: 12px 13px 5px;
    font-size: 11px; color: var(--fg-3); font-weight: 600; letter-spacing: .3px; }
  .ghead .ln { flex: 1; height: 1px; background: var(--line-soft); }
  .ghead .gn { font-variant-numeric: tabular-nums; }
  .r { display: flex; align-items: flex-start; gap: 10px; padding: 8px 13px 8px 11px; cursor: pointer;
    border-left: 3px solid transparent; transition: background .12s ease; }
  .r:hover { background: rgba(255,255,255,.035); }
  .r.sel { background: color-mix(in srgb, var(--accent) 10%, transparent); border-left-color: var(--accent); }
  .r .rdot { width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; flex: none; }
  .r .rb { flex: 1; min-width: 0; }
  .r .rt { font-size: 13px; font-weight: 550; line-height: 1.4; }
  .r .rs { color: var(--fg-3); font-size: 11.5px; line-height: 1.5; margin-top: 2px; }
  .r .rm { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .r .rright { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; padding-top: 2px; }
  .r .kchip { font-size: 10.5px; border-radius: 5px; padding: 1px 6px; font-weight: 600; }

  /* 修前：没有分组头、没有标签 chip、没有排序，行更扁更平 */
  html[data-mode="before"] .rows { padding: 0; }
  html[data-mode="before"] .ghead { display: none; }
  html[data-mode="before"] .r { padding: 11px 13px; align-items: center; border-left-width: 0; }
  html[data-mode="before"] .r .rdot,
  html[data-mode="before"] .r .rm .ftags,
  html[data-mode="before"] .r .rs { display: none; }
  html[data-mode="before"] .r .rt { font-weight: 500; }
  html[data-mode="before"] .tags { display: none; }
</style>
</head>
<body>
<div class="kbd">
  <div class="kbd-list">
    <div data-bar></div>
    <div class="kbd-scroll"><div data-list></div></div>
    <div data-pager></div>
  </div>
  <div class="kbd-detail" data-detail></div>
</div>
<script src="_shared.js"></script>
<script>
  KB.mount(function (shown) {
    // 自适应时间分组：条目少的组并回下一个组，避免稀疏组头
    const groups = KB.groupEntries(shown);
    let html = '<div class="rows">';
    for (const g of groups) {
      html += `<div class="ghead">${g.name}<span class="gn">${g.items.length}</span><span class="ln"></span></div>`;
      for (const e of g.items) {
        const k = KB.kindOf(e.kindCode);
        html += `<div class="r" data-open="${e.id}">
          <span class="rdot" style="background:${k.color}"></span>
          <span class="rb">
            <div class="rt ell">${e.title}</div>
            <div class="rs ell">${e.contentMd.split('\n')[0]}</div>
            <div class="rm">
              <span class="kchip" style="background:${k.color}22;color:${k.color}">${k.name}</span>
              <span class="ftags tg">${e.tags.map((t) => '#' + t).join(' ')}</span>
              ${e.fileLink ? '<span class="tg">📄</span>' : ''}
              ${e.sourceTaskId ? '<span class="tg">🔗</span>' : ''}
            </div>
          </span>
          <span class="rright"><span class="stamp">${KB.fmtShort(e.updatedAt)}</span></span>
        </div>`;
      }
    }
    return html + '</div>';
  });
</script>
</body>
</html>
